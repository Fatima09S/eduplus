
services:

  mysql:
    image: mysql:8.0
    container_name: eduplus-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eduplus_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - eduplus-mysql-data:/var/lib/mysql
    networks:
      - eduplus-network

  eduplus:
    image: eduplus:tp2
    container_name: eduplus-app
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      DB_URL: jdbc:mysql://mysql:3306/eduplus_db
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8081:8081"
    volumes:
      - eduplus-uploads:/app/uploads
    networks:
      - eduplus-network

volumes:
  eduplus-mysql-data:
  eduplus-uploads:

networks:
  eduplus-network:
    driver: bridge